name: macOS validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: macOS 15 / Xcode 16.4
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the tested merge or branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record and validate the full Xcode environment
        run: bash scripts/ci-check.sh environment
      - name: Check generated project consistency
        run: bash scripts/ci-check.sh project
      - name: Run standalone contracts and synthetic Vision fixtures
        run: bash scripts/ci-check.sh fixtures
      - name: Build and verify the sandboxed app
        run: bash scripts/ci-check.sh app
      - name: Build and run the hosted XCTest suite
        run: bash scripts/ci-check.sh xcode
      - name: Retain validation logs and XCTest results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-validation-${{ github.run_attempt }}
          path: |
            .build/ci/*.log
            .build/ci/*.plist
            .build/ci/xcode-*/Tests.xcresult
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
